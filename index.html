<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar CSS: Form Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* === LOGIN FORM CSS === */
    .kartu-login {
      width: 100%;
      max-width: 24rem;
      padding: 2rem;
      background-color: #ffffff;
      border: 4px solid #8b5cf6;
      outline: 3px dashed #f472b6;
      outline-offset: 8px;
    }

    .kartu-login h1 {
      font-size: 1.75rem;
      text-align: center;
    }

    /* Bagian atas: judul dan tombol x */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem;
      border-bottom: 2px dashed #f9a8d4;
    }

    .modal-header h2 {
      font-size: 1.25rem;
    }

    /* Bagian isi */
    .modal-body {
      padding: 1.25rem;
    }

    /* Tombol x untuk menutup */
    .close {
      font-size: 2rem;
      line-height: 1;
      color: #6b5b7b;
      background: none;
      border: none;
      cursor: pointer;
    }

    .close:hover {
      color: #3b2f4a;
    }
  </style>
  <script src="js/data.js"></script>
</head>

<body>
  <main style="min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem;">
    <section class="kartu-login">

      <header>
        <h1 style="border-bottom: 4px dashed #8b5cf6; padding-bottom: 0.5rem;">
          Selamat datang
        </h1>
      </header>

      <br>
      <br>

      <form action="#" method="post" id="formlogin">
        <div class="grup-input">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required
            style="width: 100%;">
        </div>

        <div class="grup-input">
          <label for="password">Kata sandi</label>
          <input type="password" id="password" name="password" placeholder="Sandi kamu" autocomplete="current-password"
            required style="width: 100%;">
        </div>

        <button type="submit" class="tombol" style="width: 100%;">Masuk</button>
      </form>

      <footer
        style="display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 2px dotted #f472b6;">
        <button type="button" class="tombol" id="tombol-lupa">Lupa password</button>
        <button type="button" class="tombol" id="tombol-daftar">Daftar</button>
      </footer>

    </section>
  </main>

  <!-- Modal 1: Lupa password -->
  <div id="modal-lupa" class="modal" role="dialog" aria-modal="true" aria-labelledby="judul-lupa">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="judul-lupa">Lupa password</h2>
        <button type="button" onclick="tutupModalLupa()" class="close" aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-body">
        <p class="subjudul">Masukkan email kamu, nanti kami kirim tautan untuk membuat kata sandi baru.</p>
        <div>
          <div class="grup-input">
            <label for="email-reset">Email terdaftar</label>
            <input type="email" id="email-reset" name="email" placeholder="nama@email.com" autocomplete="email" required
              style="width: 100%;">
          </div>
          <button onclick="kirimTautanReset()" class="tombol" style="width: 100%;">Kirim tautan reset</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal 2: Daftar -->
  <div id="modal-daftar" class="modal" role="dialog" aria-modal="true" aria-labelledby="judul-daftar">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="judul-daftar">Buat akun baru</h2>
        <button type="button" class="close" onclick="tutupModalDaftar()" aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          <div class="grup-input">
            <label for="nama-daftar">Nama lengkap</label>
            <input type="text" id="nama-daftar" name="nama" placeholder="Nama kamu" autocomplete="name" required
              style="width: 100%;">
          </div>
          <div class="grup-input">
            <label for="email-daftar">Email</label>
            <input type="email" id="email-daftar" name="email" placeholder="nama@email.com" autocomplete="email"
              required style="width: 100%;">
          </div>
          <div class="grup-input">
            <label for="sandi-daftar">Kata sandi</label>
            <input type="password" id="sandi-daftar" name="password" placeholder="Minimal 8 karakter"
              autocomplete="new-password" required style="width: 100%;">
          </div>
          <button class="tombol" onclick="daftar()" style="width: 100%;">Buat akun</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>

</html>
