<!DOCTYPE html>
<html lang="id">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking Pengiriman</title>
  <script src="js/data.js"></script>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <header style="position: sticky;top: 0;">
    <nav class="navbar">
      <a href="dashboard.html">Dashboard</a>
      <a href="stok.html">Informasi Bahan Ajar</a>
      <a href="tracking.html">Tracking Pengiriman</a>
      <div class="dropdown">
        <button class="dropbtn">Laporan &#9662;</button>
        <div class="dropdown-content">
          <a href="#monitoring">Monitoring Progress DO Bahan Ajar</a>
          <a href="#rekap">Rekap Bahan Ajar</a>
        </div>
      </div>
      <a href="#histori">Histori Transaksi Bahan Ajar</a>
    </nav>
  </header>

  <main style="padding: 3rem;">
    <h2>Tracking Pengiriman</h2>
    <h3 id="greeting"></h3>
    <section style="margin-top: 2rem;" class="section-tengah">
      <div class="grup-input">
        <h3 style="margin-bottom: 1rem;">Cari Delivery Order</h3>
        <div style="display: flex;">
          <input type="text" id="nomor-do" style="width: 100%;" placeholder="Nomor Delivery Order" />
          <button class="tombol" style="margin-left: 1.5rem;" onclick="cariDeliveryOrder()">Cari</button>
        </div>
      </div>
    </section>
    <section>
      <div id="hasil"></div>
    </section>
  </main>

  <!-- Greeting berdasarkan waktu lokal (jam di perangkat pengguna). -->
  <script>
    var sekarang = new Date();
    var jam = sekarang.getHours();
    var sapaan;

    if (jam < 11) {
      sapaan = "Selamat Pagi";      // 00.00 - 10.59
    } else if (jam < 15) {
      sapaan = "Selamat Siang";     // 11.00 - 14.59
    } else if (jam < 18) {
      sapaan = "Selamat Sore";      // 15.00 - 17.59
    } else {
      sapaan = "Selamat Malam";     // 18.00 - 23.59
    }

    document.getElementById("greeting").textContent = sapaan + "!";
  </script>

  <!-- script untuk cari delivery order -->
  <script src="js/deliverytracking.js"></script>

</body>

</html>
